<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="canonical" href="https://connorsavage.ca/sum">
  <title>sum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..1000;1,9..40,300..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --bg-elevated: #141416;
      --text: #e8e8ec;
      --text-muted: #8a8a96;
      --accent: #9db4c8;
      --border: rgba(255, 255, 255, 0.06);
      --radius: 18px;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      touch-action: manipulation;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(1.25rem, env(safe-area-inset-top))
        max(1rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1rem, env(safe-area-inset-left));
      overflow-x: hidden;
    }

    body.summer-open {
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 55% at 50% -20%, rgba(157, 180, 200, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(120, 100, 160, 0.06), transparent 45%);
      z-index: -1;
    }

    main {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main.calendar-open {
      max-width: 440px;
    }

    .count {
      font-size: clamp(3.5rem, 18vw, 5.5rem);
      font-weight: 300;
      text-align: center;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 2.25rem;
      color: var(--text);
    }

    .journal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
    }

    .day-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
    }

    .toolbar-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      min-height: 2.75rem;
      padding: 0.55rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .toolbar-btn:active {
      background: rgba(22, 24, 28, 0.98);
    }

    .toolbar-btn:hover,
    .toolbar-btn.active {
      border-color: rgba(157, 180, 200, 0.32);
      color: var(--text);
    }

    .day-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
    }

    .day-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      min-width: 5.5rem;
    }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.85rem;
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .nav-btn:active:not(:disabled) {
      background: rgba(22, 24, 28, 0.98);
    }

    .nav-btn:hover:not(:disabled) {
      border-color: rgba(157, 180, 200, 0.32);
      color: var(--text);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .add-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    input[type="text"]:focus {
      border-color: rgba(157, 180, 200, 0.32);
    }

    input[type="text"]:disabled {
      opacity: 0.45;
    }

    .add-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 2.75rem;
      padding: 0.8rem 1.1rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .add-btn:active:not(:disabled) {
      background: rgba(22, 24, 28, 0.98);
    }

    .add-btn:hover:not(:disabled) {
      border-color: rgba(157, 180, 200, 0.32);
      background: rgba(22, 24, 28, 0.98);
    }

    .add-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .entries {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
    }

    .entry {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1rem 2.25rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      text-align: center;
    }

    .entry-text {
      word-break: break-word;
    }

    .delete-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 1.25rem;
      line-height: 1;
      min-width: 2.75rem;
      min-height: 2.75rem;
      padding: 0;
      cursor: pointer;
      border-radius: 8px;
      position: absolute;
      right: 0.25rem;
      top: 50%;
      transform: translateY(-50%);
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .delete-btn:hover {
      color: #c88a8a;
    }

    .entries:empty::after,
    .entries.empty::after {
      content: "—";
      display: block;
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem;
      font-size: 0.9rem;
    }

    .summer-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
    }

    .summer-view.visible {
      display: flex;
    }

    .day-view.hidden {
      display: none;
    }

    .cal-month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      margin-bottom: 0.25rem;
    }

    .cal-month h3 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
      text-align: center;
    }

    .cal-month {
      width: 100%;
    }

    .cal-weekdays,
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.45rem;
    }

    .cal-weekdays span {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      padding-bottom: 0.2rem;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
    }

    .cal-day.blank {
      pointer-events: none;
    }

    .cal-day.in-month {
      color: var(--text);
      background: var(--bg-elevated);
      border-color: var(--border);
      cursor: pointer;
      min-height: 2.5rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .cal-day.in-month:active {
      background: rgba(22, 24, 28, 0.98);
    }

    .cal-day.in-month:hover {
      border-color: rgba(157, 180, 200, 0.32);
    }

    .cal-day.today {
      border-color: rgba(157, 180, 200, 0.45);
    }

    .cal-day.has-entries {
      background: rgba(72, 160, 104, 0.22);
      border-color: rgba(88, 190, 120, 0.4);
      color: #c8efd4;
    }

    .cal-day.has-entries:hover {
      border-color: rgba(100, 210, 140, 0.55);
    }

    .cal-day.selected {
      border-color: rgba(157, 180, 200, 0.55);
      box-shadow: 0 0 0 1px rgba(157, 180, 200, 0.2);
    }

    .cal-day.selected.has-entries {
      border-color: rgba(100, 210, 140, 0.65);
      box-shadow: 0 0 0 1px rgba(100, 210, 140, 0.25);
    }

    .cal-day-count {
      font-size: 0.55rem;
      font-weight: 600;
      color: rgba(200, 239, 212, 0.85);
      line-height: 1;
    }

    .cal-detail {
      margin-top: 1.35rem;
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.15rem 1.15rem;
      text-align: left;
    }

    .cal-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .cal-detail-date {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .cal-detail-open {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      min-height: 2.75rem;
      padding: 0 0.25rem;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .cal-detail-open:active {
      color: var(--text);
    }

    .cal-detail-open:hover {
      color: var(--text);
    }

    .cal-detail-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .cal-detail-items li {
      position: relative;
      padding-left: 0.9rem;
      font-size: 0.95rem;
      line-height: 1.45;
      word-break: break-word;
      color: var(--text);
    }

    .cal-detail-items li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(88, 190, 120, 0.75);
    }

    .cal-detail-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 0.5rem 0 0.25rem;
    }

    .save-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.04em;
      margin-top: 0.5rem;
    }

    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding-top: max(1rem, env(safe-area-inset-top));
      }

      main,
      main.calendar-open {
        max-width: 100%;
      }

      .count {
        font-size: clamp(3rem, 16vw, 4.25rem);
        margin-bottom: 1.5rem;
        margin-top: 0.25rem;
      }

      .journal {
        gap: 1.25rem;
      }

      .day-view {
        gap: 1rem;
      }

      .day-nav,
      .cal-month-nav {
        gap: 0.65rem;
      }

      .day-label {
        font-size: 0.75rem;
        min-width: 4.5rem;
      }

      .entry {
        padding: 0.95rem 2.75rem 0.95rem 1rem;
        font-size: 1rem;
        text-align: left;
        justify-content: flex-start;
      }

      .summer-view {
        gap: 1.25rem;
      }

      .cal-weekdays,
      .cal-days {
        gap: 0.28rem;
      }

      .cal-weekdays span {
        font-size: 0.6rem;
      }

      .cal-day {
        border-radius: 8px;
        font-size: 0.72rem;
        gap: 0.1rem;
      }

      .cal-day.in-month {
        min-height: 2.35rem;
      }

      .cal-day-count {
        font-size: 0.5rem;
      }

      .cal-detail {
        margin-top: 1rem;
        padding: 1rem;
      }

      .cal-detail-head {
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0.35rem 0.75rem;
      }

      .cal-detail-date {
        font-size: 0.68rem;
        line-height: 1.35;
        flex: 1;
        min-width: 0;
      }

      .cal-detail-items li {
        font-size: 1rem;
        padding-left: 1rem;
      }
    }

    @media (max-width: 360px) {
      .cal-weekdays,
      .cal-days {
        gap: 0.2rem;
      }

      .cal-day {
        font-size: 0.68rem;
      }

      .add-btn {
        padding-inline: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main id="main">
    <div class="count" id="count"></div>

    <div class="journal">
      <div class="toolbar">
        <button type="button" class="toolbar-btn" id="summer-btn">Summer</button>
      </div>

      <div class="day-view" id="day-view">
        <div class="day-nav">
          <button type="button" class="nav-btn" id="back" aria-label="Previous day">←</button>
          <span class="day-label" id="day-label"></span>
          <button type="button" class="nav-btn" id="forward" aria-label="Next day" disabled>→</button>
        </div>

        <div class="add-row">
          <input type="text" id="entry-input" placeholder="what I did…" autocomplete="off" enterkeyhint="done" inputmode="text">
          <button type="button" class="add-btn" id="add">Add</button>
        </div>

        <ul class="entries" id="entries"></ul>
      </div>

      <div class="summer-view" id="summer-view"></div>
    </div>
  </main>

  <script src="sync-config.js"></script>
  <script>
    (function () {
      var STORAGE_KEY = "sum-journal";
      var WEEKDAYS = ["S", "M", "T", "W", "T", "F", "S"];
      var SUMMER_MONTHS = [5, 6, 7];

      function todayKey() {
        return dateKey(new Date());
      }

      function dateKey(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function parseKey(key) {
        var p = key.split("-");
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }

      function formatLabel(key) {
        var today = todayKey();
        if (key === today) return "Today";
        if (key === shiftKey(today, -1)) return "Yesterday";
        return parseKey(key).toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" });
      }

      function shiftKey(key, days) {
        var d = parseKey(key);
        d.setDate(d.getDate() + days);
        return dateKey(d);
      }

      function daysUntilSept1() {
        var now = new Date();
        var year = now.getFullYear();
        var today = Date.UTC(year, now.getMonth(), now.getDate());
        var target = Date.UTC(year, 8, 1);
        if (today > target) target = Date.UTC(year + 1, 8, 1);
        return Math.round((target - today) / 86400000);
      }

      function monthEntries(year, month) {
        var prefix = year + "-" + pad(month + 1) + "-";
        return Object.keys(journal)
          .filter(function (key) { return key.indexOf(prefix) === 0 && journal[key].length > 0; })
          .sort();
      }

      function monthName(month) {
        return new Date(2026, month, 1).toLocaleDateString("en-CA", { month: "long" });
      }

      function loadJournal() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function saveJournalLocal(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function saveJournal(data) {
        journal = data;
        saveJournalLocal(data);
        scheduleCloudPush();
      }

      function mergeJournals(a, b) {
        var merged = {};
        var keys = {};
        Object.keys(a || {}).forEach(function (k) { keys[k] = true; });
        Object.keys(b || {}).forEach(function (k) { keys[k] = true; });
        Object.keys(keys).forEach(function (key) {
          var local = (a && a[key]) || [];
          var remote = (b && b[key]) || [];
          var seen = {};
          var combined = [];
          local.concat(remote).forEach(function (entry) {
            if (!seen[entry]) {
              seen[entry] = true;
              combined.push(entry);
            }
          });
          if (combined.length > 0) merged[key] = combined;
        });
        return merged;
      }

      function syncReady() {
        var c = window.SUM_SYNC;
        return c && c.key && c.binId && c.binId !== "YOUR_BIN_ID";
      }

      var cloudPushTimer = null;

      function binUrl() {
        return "https://api.jsonbin.io/v3/b/" + window.SUM_SYNC.binId;
      }

      function binHeaders() {
        return {
          "Content-Type": "application/json",
          "X-Master-Key": window.SUM_SYNC.key
        };
      }

      function pullFromCloud() {
        if (!syncReady()) return Promise.resolve();
        return fetch(binUrl() + "/latest", { headers: binHeaders() })
          .then(function (res) {
            if (!res.ok) throw new Error("pull failed");
            return res.json();
          })
          .then(function (data) {
            var remote = data.record;
            if (!remote || typeof remote !== "object") return;
            var merged = mergeJournals(journal, remote);
            if (JSON.stringify(merged) !== JSON.stringify(journal)) {
              journal = merged;
              saveJournalLocal(journal);
              render();
            }
          })
          .catch(function () {});
      }

      function scheduleCloudPush() {
        if (!syncReady()) return;
        clearTimeout(cloudPushTimer);
        cloudPushTimer = setTimeout(function () {
          fetch(binUrl(), {
            method: "PUT",
            headers: binHeaders(),
            body: JSON.stringify(journal)
          }).catch(function () {});
        }, 500);
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") pullFromCloud();
      });

      var viewing = todayKey();
      var journal = loadJournal();
      var summerOpen = false;
      var summerMonthIndex = 0;
      var summerSelectedKey = null;

      var mainEl = document.getElementById("main");
      var countEl = document.getElementById("count");
      var dayView = document.getElementById("day-view");
      var summerView = document.getElementById("summer-view");
      var summerBtn = document.getElementById("summer-btn");
      var dayLabel = document.getElementById("day-label");
      var entriesEl = document.getElementById("entries");
      var inputEl = document.getElementById("entry-input");
      var backBtn = document.getElementById("back");
      var forwardBtn = document.getElementById("forward");
      var addBtn = document.getElementById("add");

      countEl.textContent = daysUntilSept1();

      function renderDay() {
        dayLabel.textContent = formatLabel(viewing);
        var items = journal[viewing] || [];
        entriesEl.innerHTML = "";
        entriesEl.classList.toggle("empty", items.length === 0);

        items.forEach(function (text, index) {
          var li = document.createElement("li");
          li.className = "entry";

          var span = document.createElement("span");
          span.className = "entry-text";
          span.textContent = text;

          var del = document.createElement("button");
          del.type = "button";
          del.className = "delete-btn";
          del.setAttribute("aria-label", "Delete entry");
          del.textContent = "×";
          del.addEventListener("click", function () {
            journal[viewing].splice(index, 1);
            if (journal[viewing].length === 0) delete journal[viewing];
            saveJournal(journal);
            render();
          });

          li.appendChild(span);
          li.appendChild(del);
          entriesEl.appendChild(li);
        });

        var isToday = viewing === todayKey();
        forwardBtn.disabled = viewing >= todayKey();
        inputEl.disabled = !isToday;
        addBtn.disabled = !isToday;
      }

      function currentSummerMonthIndex() {
        var m = new Date().getMonth();
        var i = SUMMER_MONTHS.indexOf(m);
        return i >= 0 ? i : 0;
      }

      function defaultSummerSelection(year, month) {
        var today = todayKey();
        var prefix = year + "-" + pad(month + 1) + "-";
        if (today.indexOf(prefix) === 0) return today;
        var keys = monthEntries(year, month);
        if (keys.length > 0) return keys[keys.length - 1];
        return year + "-" + pad(month + 1) + "-01";
      }

      function formatDetailDate(key) {
        return parseKey(key).toLocaleDateString("en-CA", {
          weekday: "long",
          month: "short",
          day: "numeric"
        });
      }

      function renderSummerDetail(key) {
        var detail = document.createElement("div");
        detail.className = "cal-detail";

        var head = document.createElement("div");
        head.className = "cal-detail-head";

        var dateLabel = document.createElement("span");
        dateLabel.className = "cal-detail-date";
        dateLabel.textContent = formatDetailDate(key);

        var openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "cal-detail-open";
        openBtn.textContent = "open day →";
        openBtn.addEventListener("click", function () {
          viewing = key;
          setSummer(false);
        });

        head.appendChild(dateLabel);
        head.appendChild(openBtn);
        detail.appendChild(head);

        var items = journal[key] || [];
        if (items.length === 0) {
          var empty = document.createElement("p");
          empty.className = "cal-detail-empty";
          empty.textContent = "—";
          detail.appendChild(empty);
        } else {
          var list = document.createElement("ul");
          list.className = "cal-detail-items";
          items.forEach(function (text) {
            var li = document.createElement("li");
            li.textContent = text;
            list.appendChild(li);
          });
          detail.appendChild(list);
        }

        return detail;
      }

      function renderSummer(scrollToDetail) {
        summerView.innerHTML = "";
        var year = new Date().getFullYear();
        var today = todayKey();
        var month = SUMMER_MONTHS[summerMonthIndex];

        if (!summerSelectedKey || summerSelectedKey.indexOf(year + "-" + pad(month + 1) + "-") !== 0) {
          summerSelectedKey = defaultSummerSelection(year, month);
        }

        var nav = document.createElement("div");
        nav.className = "cal-month-nav";

        var monthBack = document.createElement("button");
        monthBack.type = "button";
        monthBack.className = "nav-btn";
        monthBack.setAttribute("aria-label", "Previous month");
        monthBack.textContent = "←";
        monthBack.disabled = summerMonthIndex === 0;
        monthBack.addEventListener("click", function () {
          if (summerMonthIndex > 0) {
            summerMonthIndex--;
            summerSelectedKey = null;
            renderSummer();
          }
        });

        var monthLabel = document.createElement("span");
        monthLabel.className = "day-label";
        monthLabel.textContent = monthName(month);

        var monthForward = document.createElement("button");
        monthForward.type = "button";
        monthForward.className = "nav-btn";
        monthForward.setAttribute("aria-label", "Next month");
        monthForward.textContent = "→";
        monthForward.disabled = summerMonthIndex === SUMMER_MONTHS.length - 1;
        monthForward.addEventListener("click", function () {
          if (summerMonthIndex < SUMMER_MONTHS.length - 1) {
            summerMonthIndex++;
            summerSelectedKey = null;
            renderSummer();
          }
        });

        nav.appendChild(monthBack);
        nav.appendChild(monthLabel);
        nav.appendChild(monthForward);
        summerView.appendChild(nav);

        var block = document.createElement("div");
        block.className = "cal-month";

        var weekdays = document.createElement("div");
        weekdays.className = "cal-weekdays";
        WEEKDAYS.forEach(function (label) {
          var span = document.createElement("span");
          span.textContent = label;
          weekdays.appendChild(span);
        });

        var days = document.createElement("div");
        days.className = "cal-days";

        var first = new Date(year, month, 1);
        var total = new Date(year, month + 1, 0).getDate();
        var start = first.getDay();

        for (var i = 0; i < start; i++) {
          var blank = document.createElement("div");
          blank.className = "cal-day blank";
          days.appendChild(blank);
        }

        for (var day = 1; day <= total; day++) {
          var key = year + "-" + pad(month + 1) + "-" + pad(day);
          var cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cal-day in-month";
          if (key === today) cell.classList.add("today");
          if (journal[key] && journal[key].length > 0) cell.classList.add("has-entries");
          if (key === summerSelectedKey) cell.classList.add("selected");

          var num = document.createElement("span");
          num.textContent = day;
          cell.appendChild(num);

          if (journal[key] && journal[key].length > 0) {
            var count = document.createElement("span");
            count.className = "cal-day-count";
            count.textContent = journal[key].length;
            cell.appendChild(count);
          }

          cell.addEventListener("click", function (k) {
            return function () {
              summerSelectedKey = k;
              renderSummer(true);
            };
          }(key));

          days.appendChild(cell);
        }

        block.appendChild(weekdays);
        block.appendChild(days);
        block.appendChild(renderSummerDetail(summerSelectedKey));
        summerView.appendChild(block);

        requestAnimationFrame(function () {
          if (!scrollToDetail) return;
          var detail = summerView.querySelector(".cal-detail");
          if (detail && window.matchMedia("(max-width: 480px)").matches) {
            detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }
        });
      }

      function render() {
        if (summerOpen) {
          renderSummer();
        } else {
          renderDay();
        }
      }

      function setSummer(open) {
        summerOpen = open;
        if (open) {
          summerMonthIndex = currentSummerMonthIndex();
          summerSelectedKey = null;
        }
        document.body.classList.toggle("summer-open", open);
        summerBtn.classList.toggle("active", open);
        summerBtn.textContent = open ? "Day" : "Summer";
        dayView.classList.toggle("hidden", open);
        summerView.classList.toggle("visible", open);
        mainEl.classList.toggle("calendar-open", open);
        render();
      }

      function addEntry() {
        var text = inputEl.value.trim();
        if (!text || viewing !== todayKey()) return;
        if (!journal[viewing]) journal[viewing] = [];
        journal[viewing].push(text);
        saveJournal(journal);
        inputEl.value = "";
        render();
        inputEl.focus();
      }

      document.getElementById("add").addEventListener("click", addEntry);
      inputEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") addEntry();
      });

      backBtn.addEventListener("click", function () {
        viewing = shiftKey(viewing, -1);
        render();
      });

      forwardBtn.addEventListener("click", function () {
        if (viewing < todayKey()) {
          viewing = shiftKey(viewing, 1);
          render();
        }
      });

      summerBtn.addEventListener("click", function () {
        setSummer(!summerOpen);
      });

      if (syncReady()) {
        pullFromCloud().then(scheduleCloudPush);
      }

      render();
    })();
  </script>
</body>
</html>
