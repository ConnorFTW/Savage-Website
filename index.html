  <style>
    :root {
      --bg: #0c0c0e;
      --bg-elevated: #141416;
      --text: #e8e8ec;
      --text-muted: #8a8a96;
      --accent: #9db4c8;
      --accent-soft: rgba(157, 180, 200, 0.12);
      --border: rgba(255, 255, 255, 0.06);
      --radius: 18px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.15, 0.64, 1);
      --ease-smooth: cubic-bezier(0.33, 1, 0.68, 1);
      --t-hover: 0.42s var(--ease-out-expo);
      --t-micro: 0.28s var(--ease-smooth);
      --mx: 50%;
      --my: 30%;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: rgba(232, 232, 236, 0.12) transparent;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: rgba(232, 232, 236, 0.1);
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: rgba(232, 232, 236, 0.16);
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(16px, 2.75vw, 18.5px);
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(3rem, 10vw, 6rem) 1.5rem 3.5rem;
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at var(--mx) var(--my), rgba(157, 180, 200, 0.16), transparent 55%),
        radial-gradient(ellipse 80% 55% at 50% -20%, rgba(157, 180, 200, 0.1), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(120, 100, 160, 0.05), transparent 45%);
      z-index: -1;
      opacity: 0;
      animation: backdrop-in 3.2s var(--ease-out-expo) 0.2s forwards;
      transition: background-position 0.1s linear;
    }

    @keyframes backdrop-in {
      from {
        opacity: 0;
        transform: scale(1.12);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(52px);
        filter: brightness(1.12);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: brightness(1);
      }
    }

    @keyframes caret-blink {
      0%, 45% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    @keyframes name-line {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }
      65% {
        opacity: 0.55;
      }
      100% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    header .name-headline {
      position: relative;
      display: inline-block;
      text-align: left;
      min-height: 1.08em;
    }

    header .name-sizer {
      visibility: hidden;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    header .name-live {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    header .name-typed {
      white-space: pre;
    }

    header .name-caret {
      display: inline-block;
      width: 0.08em;
      height: 0.82em;
      margin-left: 0.08em;
      background: rgba(157, 180, 200, 0.85);
      border-radius: 1px;
      transform: translateY(0.08em);
      opacity: 0;
      vertical-align: baseline;
    }

    header .name-caret.is-typing {
      opacity: 1;
      animation: caret-blink 0.9s steps(1) infinite;
    }

    header .name-caret.is-done {
      animation: none;
      opacity: 0;
      transition: opacity 0.35s var(--ease-smooth);
    }

    header .name::after {
      content: "";
      display: block;
      width: min(320px, 82vw);
      height: 2px;
      margin: clamp(1.1rem, 3vw, 1.5rem) auto 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(157, 180, 200, 0.5) 42%,
        rgba(232, 232, 236, 0.2) 60%,
        transparent
      );
      transform-origin: center;
      opacity: 0;
      transform: scaleX(0);
    }

    header.is-typed .name::after {
      animation: name-line 1.5s var(--ease-out-expo) forwards;
    }

    section h2 {
      opacity: 0;
      animation: rise-in 1.35s var(--ease-out-expo) forwards;
    }

    section:nth-of-type(1) h2 {
      animation-delay: 2.4s;
    }

    section:nth-of-type(1) ul li:nth-child(1),
    section:nth-of-type(1) ul li:nth-child(2),
    section:nth-of-type(1) ul li:nth-child(3),
    section:nth-of-type(1) ul li:nth-child(4),
    section:nth-of-type(2) h2,
    section:nth-of-type(2) ul li:nth-child(1),
    section:nth-of-type(2) ul li:nth-child(2),
    section:nth-of-type(3) h2,
    section:nth-of-type(3) ul li:nth-child(1),
    section:nth-of-type(3) ul li:nth-child(2) {
      opacity: 0;
      animation: rise-in 1.32s var(--ease-out-expo) forwards;
    }

    section:nth-of-type(1) ul li:nth-child(1) {
      animation-delay: 2.85s;
    }

    section:nth-of-type(1) ul li:nth-child(2) {
      animation-delay: 3.3s;
    }

    section:nth-of-type(1) ul li:nth-child(3) {
      animation-delay: 3.75s;
    }

    section:nth-of-type(1) ul li:nth-child(4) {
      animation-delay: 4.2s;
    }

    section:nth-of-type(2) h2 {
      animation-delay: 4.75s;
    }

    section:nth-of-type(2) ul li:nth-child(1) {
      animation-delay: 5.2s;
    }

    section:nth-of-type(2) ul li:nth-child(2) {
      animation-delay: 5.65s;
    }

    section:nth-of-type(3) h2 {
      animation-delay: 6.15s;
    }

    section:nth-of-type(3) ul li:nth-child(1) {
      animation-delay: 6.6s;
    }

    section:nth-of-type(3) ul li:nth-child(2) {
      animation-delay: 7.05s;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      body::before {
        animation: none;
        opacity: 1;
        transform: none;
      }

      #bg-canvas {
        display: none;
      }

      header .name-caret {
        display: none;
      }

      header .name-sizer {
        visibility: visible;
      }

      header .name-live,
      header .tagline-live {
        display: none;
      }

      header .tagline-sizer {
        visibility: visible;
      }

      header .tagline-caret {
        display: none;
      }

      header .name::after,
      header .tagline,
      section h2,
      section ul li {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        letter-spacing: inherit !important;
        filter: none !important;
        width: auto;
      }

      header .name::after {
        transform: scaleX(1);
        opacity: 1;
      }

      header .tagline {
        letter-spacing: normal !important;
      }

      .card-link,
      .card-link:hover,
      .link-label,
      .link-meta,
      .arrow {
        transition-duration: 0.12s !important;
      }
    }

    main {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: clamp(3.25rem, 9vw, 4.75rem);
    }

    @media (prefers-reduced-motion: reduce) {
      header .name-headline,
      header .tagline {
        will-change: auto;

    }

    header .tagline-sizer {
      visibility: hidden;

    }

    header .tagline-live {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: flex-start;
      white-space: pre;
    }

    header .tagline-typed {
      white-space: pre;
    }

    header .tagline-caret {
      display: inline-block;
      width: 0.45em;
      height: 1.05em;
      margin-left: 0.05em;
      background: rgba(157, 180, 200, 0.75);
      border-radius: 1px;
      opacity: 0;
      transform: translateY(0.12em);
    }

    header .tagline-caret.is-typing {
      opacity: 1;
      animation: caret-blink 0.9s steps(1) infinite;
    }

    header .tagline-caret.is-done {
      animation: none;
      opacity: 0;
      transition: opacity 0.35s var(--ease-smooth);
    }

    @media (max-width: 380px) {
      header .tagline {
        font-size: 0.72rem;
      }
    }

    section {
      margin-bottom: clamp(2.35rem, 6vw, 3rem);
    }

    section:last-of-type {
      margin-bottom: 0;
    }

    h2 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    a.card-link {
      text-decoration: none;
    }

    button.card-link {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      margin: 0;
      cursor: pointer;
      font: inherit;
      text-align: start;
    }

    .card-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.1rem;
      padding: 1.1rem 1.2rem;
      color: inherit;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow:
        0 0 0 0 transparent,
        0 1px 2px rgba(0, 0, 0, 0.2);
      transition:
        border-color var(--t-hover),
        background var(--t-hover),
        box-shadow var(--t-hover),
        transform var(--t-hover);
    }

    .card-link:hover {
      border-color: rgba(157, 180, 200, 0.32);
      background: rgba(22, 24, 28, 0.98);
      box-shadow:
        0 12px 40px -18px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(157, 180, 200, 0.08);
    }

    @media (hover: hover) and (pointer: fine) {
      .card-link:hover {
        transform: translateY(-3px);
      }

      .card-link:active {
        transform: translateY(-1px) scale(0.995);
      }
    }

    .card-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .link-label {
      font-weight: 500;
      transition: color var(--t-micro);
    }

    .link-meta {
      color: var(--text-muted);
      font-size: 0.875rem;
      flex-shrink: 0;
      transition: color var(--t-micro), transform var(--t-hover);
    }

    @media (hover: hover) and (pointer: fine) {
      .card-link:hover .link-meta {
        color: rgba(232, 232, 236, 0.72);
        transform: translateX(2px);
      }

      .card-link:hover .link-label {
        color: rgba(247, 248, 251, 0.98);
      }
    }

    .link-meta .arrow {
      display: inline-block;
      transition: transform var(--t-hover);
    }

    @media (hover: hover) and (pointer: fine) {
      .card-link:hover .link-meta .arrow {
        transform: translateX(3px);
      }
    }

  </style>
</head>

  <script>
    (function () {
      var b = document.getElementById("discord-copy");
      if (b) {
        b.addEventListener("click", function () {
          navigator.clipboard.writeText("connorftw").catch(function () {});
        });
      }

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var header = document.getElementById("site-header");
      var typedEl = document.getElementById("name-typed");
      var caretEl = document.getElementById("name-caret");
      var codeEl = document.getElementById("code-typed");
      var codeCaret = document.getElementById("code-caret");
      var fullName = "Connor Savage";
      var codeLines = "if (tired) drinkEspresso();\nelse keepCoding();";

      function typeText(el, caret, text, done) {
        var i = 0;
        if (caret) caret.classList.add("is-typing");
        (function typeNext() {
          if (i < text.length) {
            el.textContent += text.charAt(i);
            i += 1;
            var ch = text.charAt(i - 1);
            var delay = ch === "\n" ? 220 : ch === " " ? 55 : 38 + Math.random() * 22;
            setTimeout(typeNext, delay);
          } else {
            if (caret) {
              caret.classList.remove("is-typing");
              setTimeout(function () {
                caret.classList.add("is-done");
              }, 180);
            }
            if (done) done();
          }
        })();
      }

      function finishName() {
        if (!header) return;
        header.classList.add("is-typed");
        if (caretEl) {
          caretEl.classList.remove("is-typing");
          setTimeout(function () {
            caretEl.classList.add("is-done");
          }, 200);
        }
        if (codeEl && !reduceMotion) {
          setTimeout(function () {
            typeText(codeEl, codeCaret, codeLines);
          }, 280);
        }
      }

      if (typedEl) {
        if (reduceMotion) {
          if (codeEl) codeEl.textContent = codeLines;
          finishName();
        } else {
          setTimeout(function () {
            typeText(typedEl, caretEl, fullName, finishName);
          }, 320);
        }
      }

      var finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (reduceMotion || !finePointer) return;

      var canvas = document.getElementById("bg-canvas");
      if (!canvas) return;
      var ctx = canvas.getContext("2d");
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var width = 0;
      var height = 0;
      var dots = [];
      var mouse = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
      var raf = 0;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildDots();
      }

      function buildDots() {
        dots = [];
        var gap = width < 700 ? 36 : 42;
        for (var y = gap * 0.5; y < height; y += gap) {
          for (var x = gap * 0.5; x < width; x += gap) {
            dots.push({
              x: x,
              y: y,
              ox: x,
              oy: y,
              phase: Math.random() * Math.PI * 2
            });
          }
        }
      }

      function onMove(e) {
        mouse.tx = e.clientX;
        mouse.ty = e.clientY;
        document.body.style.setProperty("--mx", (e.clientX / width) * 100 + "%");
        document.body.style.setProperty("--my", (e.clientY / height) * 100 + "%");
      }

      function onLeave() {
        mouse.tx = width * 0.5;
        mouse.ty = height * 0.28;
      }

      function frame(t) {
        raf = requestAnimationFrame(frame);
        mouse.x += (mouse.tx - mouse.x) * 0.12;
        mouse.y += (mouse.ty - mouse.y) * 0.12;

        ctx.clearRect(0, 0, width, height);

        var time = t * 0.001;
        var radius = Math.min(220, Math.max(140, width * 0.22));

        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          var dx = mouse.x - d.ox;
          var dy = mouse.y - d.oy;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var influence = Math.max(0, 1 - dist / radius);
          var pull = influence * influence;
          var angle = Math.atan2(dy, dx);

          d.x = d.ox + Math.cos(angle) * pull * 14;
          d.y = d.oy + Math.sin(angle) * pull * 14;

          var pulse = 0.35 + Math.sin(time * 1.2 + d.phase) * 0.08;
          var alpha = pulse + pull * 0.7;
          var size = 1.1 + pull * 2.2;

          if (pull > 0.08) {
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.ox + dx * 0.08, d.oy + dy * 0.08);
            ctx.strokeStyle = "rgba(157, 180, 200," + (pull * 0.22) + ")";
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(d.x, d.y, size, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(157, 180, 200," + (alpha * 0.28) + ")";
          ctx.fill();
        }
      }

      resize();
      mouse.x = mouse.tx = width * 0.5;
      mouse.y = mouse.ty = height * 0.28;
      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", onMove, { passive: true });
      window.addEventListener("pointerleave", onLeave);
      raf = requestAnimationFrame(frame);

      window.addEventListener("pagehide", function () {
        cancelAnimationFrame(raf);
      });
    })();
  </script>
</body>
</html>
